name: Security evidence

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install pip-audit==2.7.3 cyclonedx-bom==4.6.0 pytest==8.3.5 ruff==0.8.6
      - run: python -m pip_audit -r requirements.lock --strict
      - run: cyclonedx-py requirements requirements.lock --output-file sbom.json
      - uses: actions/upload-artifact@v7
        with:
          name: cyclonedx-sbom
          path: sbom.json
      - run: pytest -q
      - run: ruff check .
